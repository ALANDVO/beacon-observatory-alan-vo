[project]
name = "beacon-observatory-backend"
version = "1.0.0"
description = "Beacon Observatory Backend"
authors = [{name = "Alan Vo", email = "alanvo@gmail.com"}]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.34",
    "alembic==1.13.2",
    "python-multipart==0.0.11",
    "httpx==0.27.2",
    "pytest==8.3.3",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.pytest-asyncio]
mode = "auto"